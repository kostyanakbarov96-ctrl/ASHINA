<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>ASHINA Test 1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f16;color:#fff;font-family:system-ui,sans-serif}header{padding:22px 18px 12px}.logo{font-size:28px;font-weight:800;letter-spacing:2px}.sub,.muted{opacity:.65;font-size:13px}nav{display:flex;gap:8px;padding:10px 14px;background:#0b0f16;position:sticky;top:0}button{border:1px solid #303846;background:#151b25;color:#fff;border-radius:12px;padding:11px 14px}nav .active{background:#26354b}main{padding:12px 14px}.card{background:#111722;border:1px solid #252e3b;border-radius:18px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.big{font-size:20px;font-weight:700}.controls{display:flex;gap:10px;margin:16px 0}.progress{width:100%}.hidden{display:none}input[type=range]{accent-color:#fff}.badge{padding:5px 9px;border-radius:99px;background:#1b2636;font-size:12px}</style></head><body><header><div class="logo">ASHINA</div><div class="sub">Test 1.0 · Music / Chat / Settings</div></header><nav><button class="active" data-tab="chat">💬 Чат</button><button data-tab="music">🎵 Музыка</button><button data-tab="settings">⚙️ Настройки</button></nav><main><section id="chat"><div class="card"><h2>Чат</h2><p class="muted">Тестовый экран ASHINA.</p><span class="badge">0+</span> <span class="badge">Безопасный режим</span></div></section><section id="music" class="hidden"><div class="card"><h2>🎵 ASHINA Music</h2><div class="row"><div><div class="big">ASHINA Test Tone</div><div class="muted">Встроенный аудиотрек</div></div><span class="badge">TEST</span></div><audio id="audio" preload="auto" src="audio.wav"></audio><div class="controls"><button id="play">▶️</button><button id="back">↺ 10с</button><button id="forward">10с ↻</button></div><input id="seek" class="progress" type="range" min="0" max="100" value="0"><div class="row"><span id="time">0:00 / 0:00</span><span>🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></span></div><p class="muted">Проверь звук, паузу, перемотку и блокировку экрана.</p></div></section><section id="settings" class="hidden"><div class="card"><h2>⚙️ Настройки</h2><div class="row"><span>Сохранение настроек</span><input id="save" type="checkbox" checked></div><p class="muted">Тест реакции настроек.</p></div></section></main><script>document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden")});const a=document.getElementById("audio"),p=document.getElementById("play"),s=document.getElementById("seek");p.onclick=async()=>{if(a.paused){try{await a.play()}catch(e){alert("Нажми Play ещё раз для разрешения звука")}}else a.pause()};a.onplay=()=>p.textContent="⏸️";a.onpause=()=>p.textContent="▶️";a.ontimeupdate=()=>{if(a.duration)s.value=a.currentTime/a.duration*100;document.getElementById("time").textContent=f(a.currentTime)+" / "+f(a.duration||0)};s.oninput=()=>{if(a.duration)a.currentTime=s.value/100*a.duration};document.getElementById("volume").oninput=e=>a.volume=e.target.value;document.getElementById("back").onclick=()=>a.currentTime=Math.max(0,a.currentTime-10);document.getElementById("forward").onclick=()=>a.currentTime=Math.min(a.duration||0,a.currentTime+10);function f(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
